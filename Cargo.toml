[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/core-api",
    "crates/nms",
    "crates/collector-snmp",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
rand = "0.8"
ipnet = { version = "2", features = ["serde"] }
if-addrs = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
dns-lookup = "2"
argon2 = "0.5"
sha2 = "0.10"
serde_yaml = "0.9"
tempfile = "3"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
